#cloud-config
package_update: true
package_upgrade: false

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - arping
  - lvm2
  - git

write_files:
  - content: |
      127.0.0.1 localhost
      ${control_plane_ip} k8s-api.local
    path: /etc/hosts

  - content: |
      ingressRoute:
        dashboard:
          enabled: false
      service:
        enabled: true
        type: LoadBalancer
      ports:
        web:
          port: 8000
          expose:
            default: true
          exposedPort: 80
          protocol: TCP
        websecure:
          port: 8443
          expose:
            default: true
          exposedPort: 443
          protocol: TCP
      providers:
        kubernetesCRD:
          enabled: true
          allowCrossNamespace: true
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: true
    path: /root/traefik-values.yaml

  - content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: whoami
        namespace: default
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: whoami
        template:
          metadata:
            labels:
              app: whoami
          spec:
            containers:
              - name: whoami
                image: traefik/whoami
                ports:
                  - containerPort: 80
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: whoami
        namespace: default
      spec:
        selector:
          app: whoami
        ports:
          - port: 80
            targetPort: 80
      ---
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: whoami-route
        namespace: default
      spec:
        entryPoints:
          - web
        routes:
          - kind: Rule
            match: Host(`whoami.mpms.lab`)
            services:
              - name: whoami
                port: 80
    path: /root/exemple-ingressroute.yaml

  # ArgoCD values - host-based routing, no basehref needed
  - content: |
      controller:
        replicas: 1
      redis-ha:
        enabled: true
      server:
        replicas: 1
        service:
          type: ClusterIP
        ingress:
          enabled: false
      repoServer:
        replicas: 1
      applicationSet:
        replicas: 1
      configs:
        params:
          server.insecure: true
    path: /root/argocd-values.yaml

  # ArgoCD repo credentials (Secret avec PAT GitHub)
  # Note: ce fichier est généré par Terraform (templatefile) et supprimé après usage
  # Le PAT n'apparaît jamais dans les fichiers YAML du dépôt Git
  - content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: github-repo-creds
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      stringData:
        type: git
        url: https://github.com/PierreJaloghlian
        username: PierreJaloghlian
        password: ${github_pat}
    path: /root/argocd-repo-creds.yaml
    permissions: '0600'

  # ArgoCD Applications - GitOps stack
  - content: |
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: monitoring
        namespace: argocd
      spec:
        description: Monitoring stack (Grafana, Prometheus, kube-state-metrics)
        sourceRepos:
          - "https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git"
          - "https://charts.external-secrets.io"
        destinations:
          - namespace: "*"
            server: https://kubernetes.default.svc
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: grafana
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: grafana
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: prometheus
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: prometheus
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: kube-state-metrics
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: kube-state-metrics
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: pihole
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: pihole
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: uptime-kuma
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: uptime-kuma
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: ceph-dashboard
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: ceph-dashboard
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: vault
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: vault
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: vault-config
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: vault-config
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: external-secrets
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 0.10.7
          helm:
            releaseName: external-secrets
            values: |
              installCRDs: true
        destination:
          server: https://kubernetes.default.svc
          namespace: external-secrets
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

    path: /root/argocd-apps.yaml

  # MinIO deployment for Velero (credentials via K8s Secret, pas en dur)
  - content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: minio
        namespace: velero
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: minio
        template:
          metadata:
            labels:
              app: minio
          spec:
            containers:
              - name: minio
                image: minio/minio:latest
                command: ["minio", "server", "/data", "--console-address", ":9001"]
                envFrom:
                  - secretRef:
                      name: minio-credentials
                ports:
                  - containerPort: 9000
                  - containerPort: 9001
                volumeMounts:
                  - name: data
                    mountPath: /data
            volumes:
              - name: data
                emptyDir: {}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: minio
        namespace: velero
      spec:
        selector:
          app: minio
        ports:
          - name: api
            port: 9000
            targetPort: 9000
          - name: console
            port: 9001
            targetPort: 9001
    path: /root/minio.yaml

  # Velero credentials (généré par Terraform, supprimé après usage)
  - content: |
      [default]
      aws_access_key_id = ${minio_access_key}
      aws_secret_access_key = ${minio_secret_key}
    path: /root/credentials-velero
    permissions: '0600'

  - content: |
      #!/bin/bash
      export KUBECONFIG=/root/.kube/config

      echo "=========================================="
      echo "        ÉTAT DU CLUSTER KUBERNETES       "
      echo "=========================================="
      echo ""
      
      echo "=== Nodes ==="
      kubectl get nodes -o wide
      echo ""
      
      echo "=== Cilium ==="
      kubectl get pods -n kube-system -l app.kubernetes.io/part-of=cilium --no-headers | head -5
      echo "... ($(kubectl get pods -n kube-system -l app.kubernetes.io/part-of=cilium --no-headers | wc -l) pods total)"
      echo ""
      
      echo "=== MetalLB ==="
      kubectl get pods -n metallb-system --no-headers
      kubectl get ipaddresspool -n metallb-system
      echo ""
      
      echo "=== Traefik ==="
      kubectl get pods -n traefik
      kubectl get svc -n traefik
      echo ""
      
      echo "=== ArgoCD ==="
      kubectl get pods -n argocd --no-headers | head -10
      echo "... ($(kubectl get pods -n argocd --no-headers | wc -l) pods total)"
      echo ""

      echo "=== ArgoCD Applications ==="
      kubectl get applications -n argocd
      echo ""

      echo "=== Rook-Ceph ==="
      kubectl get pods -n rook-ceph --no-headers | head -10
      echo "... ($(kubectl get pods -n rook-ceph --no-headers 2>/dev/null | wc -l) pods total)"
      kubectl get cephcluster -n rook-ceph 2>/dev/null
      echo ""

      echo "=== Velero ==="
      kubectl get pods -n velero --no-headers
      echo ""

      echo "=== Grafana ==="
      kubectl get pods -n grafana 2>/dev/null || echo "  (pas encore déployé)"
      echo ""

      echo "=== Prometheus ==="
      kubectl get pods -n monitoring 2>/dev/null || echo "  (pas encore déployé)"
      echo ""

      echo "=== Pi-hole ==="
      kubectl get pods -n pihole 2>/dev/null || echo "  (pas encore déployé)"
      PIHOLE_IP=$(kubectl get svc pihole-dns -n pihole -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
      echo "  DNS IP: $${PIHOLE_IP:-pending}"
      echo ""

      echo "=== Uptime Kuma ==="
      kubectl get pods -n uptime-kuma 2>/dev/null || echo "  (pas encore déployé)"
      echo ""

      echo "=== Ceph Dashboard ==="
      kubectl get svc -n rook-ceph rook-ceph-mgr-dashboard 2>/dev/null || echo "  (pas encore déployé)"
      echo ""

      echo "=== Vault ==="
      kubectl get pods -n vault 2>/dev/null || echo "  (pas encore déployé)"
      VAULT_STATUS=$(kubectl exec -n vault deploy/vault -- vault status -format=json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(f'initialized={d[\"initialized\"]} sealed={d[\"sealed\"]}')" 2>/dev/null || echo "unknown")
      echo "  Status: $${VAULT_STATUS}"
      echo ""

      echo "=== External Secrets Operator ==="
      kubectl get pods -n external-secrets 2>/dev/null || echo "  (pas encore déployé)"
      echo ""

      echo "=== ExternalSecrets Status ==="
      kubectl get externalsecrets -A 2>/dev/null || echo "  (aucun ExternalSecret)"
      echo ""

      echo "=========================================="
      echo "  ACCÈS AUX SERVICES (DNS)"
      echo "=========================================="
      echo "  Whoami:         http://whoami.mpms.lab"
      echo "  ArgoCD:         http://argocd.mpms.lab"
      echo "  ArgoCD:         https://argocd.mpms.lab (certificat auto-signé)"
      echo "  Grafana:        http://grafana.mpms.lab"
      echo "  Prometheus:     http://prometheus.mpms.lab"
      echo "  Pi-hole:        http://pihole.mpms.lab"
      echo "  Uptime Kuma:    http://status.mpms.lab"
      echo "  Ceph Dashboard: http://ceph.mpms.lab"
      echo "  Vault:          http://vault.mpms.lab"
      echo "  Vault:          https://vault.mpms.lab"
      echo "  Pi-hole DNS:    $${PIHOLE_IP:-10.202.20.11} (port 53)"
      echo ""
      echo "  ArgoCD Login:"
      echo "    Username: admin"
      if [ -f /root/argocd-admin-password.txt ]; then
        echo "    Password: $(cat /root/argocd-admin-password.txt)"
      else
        echo "    Password: kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath='{.data.password}' | base64 -d"
      fi
      echo ""
      echo "  Grafana Login:"
      echo "    Username: admin"
      echo "    Password: (géré par Vault)"
      echo ""
      echo "  Pi-hole Login:"
      echo "    Password: (géré par Vault)"
      echo ""
      echo "  Ceph Dashboard Login:"
      echo "    Username: admin"
      echo "    Password: kubectl -n rook-ceph get secret rook-ceph-dashboard-password -o jsonpath='{.data.password}' | base64 -d"
      echo ""
      echo "  Vault Login:"
      if [ -f /root/vault-credentials.txt ]; then
        echo "    Root Token: $(grep 'Root Token' /root/vault-credentials.txt | awk '{print $NF}')"
      else
        echo "    Voir /root/vault-credentials.txt après init"
      fi
      echo ""
      echo "  Velero:"
      echo "    velero backup create <n> --default-volumes-to-fs-backup"
      echo "    velero backup get"
      echo "=========================================="
    path: /root/check-cluster.sh
    permissions: '0755'

runcmd:
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab
  - echo -e "overlay\nbr_netfilter" > /etc/modules-load.d/k8s.conf
  - modprobe overlay && modprobe br_netfilter
  - echo -e "net.bridge.bridge-nf-call-ip6tables = 1\nnet.bridge.bridge-nf-call-iptables = 1\nnet.ipv4.ip_forward = 1" > /etc/sysctl.d/k8s.conf
  - sysctl --system
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - |
    ARCH=$(dpkg --print-architecture)
    CODENAME=$(lsb_release -cs)
    echo "deb [arch=$ARCH signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $CODENAME stable" > /etc/apt/sources.list.d/docker.list
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y containerd.io kubelet=1.30.14-* kubeadm=1.30.14-* kubectl=1.30.14-*
  - apt-mark hold kubelet kubeadm kubectl
  - containerd config default | tee /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable --now kubelet
  - kubeadm init --kubernetes-version=v1.30.14 --control-plane-endpoint "k8s-api.local:6443" --pod-network-cidr=10.244.0.0/16 --upload-certs --ignore-preflight-errors=NumCPU,Mem
  - mkdir -p /root/.kube && cp /etc/kubernetes/admin.conf /root/.kube/config
  - mkdir -p /home/ubuntu/.kube && cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
  - chown ubuntu:ubuntu /home/ubuntu/.kube/config
  - |
    CERT_KEY=$(kubeadm init phase upload-certs --upload-certs | tail -1)
    JOIN_CMD=$(kubeadm token create --print-join-command)
    echo "$JOIN_CMD" > /root/join-worker.sh
    echo "$JOIN_CMD --control-plane --certificate-key $CERT_KEY" > /root/join-cp.sh
    chmod +x /root/join-worker.sh /root/join-cp.sh
  # Libérer Terraform (les services s'installent après)
  - touch /root/cloud-init-complete
  # ====================================================
  # INSTALLATION DES SERVICES KUBERNETES
  # (après cloud-init-complete pour ne pas bloquer Terraform)
  # ====================================================
  # Cilium CNI
  - |
    export KUBECONFIG=/root/.kube/config
    curl -L --remote-name-all https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-amd64.tar.gz
    tar -xzf cilium-linux-amd64.tar.gz -C /usr/local/bin
    /usr/local/bin/cilium install --version 1.16.5
  - |
    export KUBECONFIG=/root/.kube/config
    sleep 30
    kubectl wait --for=condition=Ready pods -l app.kubernetes.io/part-of=cilium -n kube-system --timeout=300s || true
  # MetalLB
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl wait --namespace metallb-system --for=condition=available deployment/controller --timeout=300s || sleep 60
  - |
    export KUBECONFIG=/root/.kube/config
    idx=0
    while [ $idx -lt 10 ]; do
      if cat <<'METALEOF' | kubectl apply -f -
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: default-pool
      namespace: metallb-system
    spec:
      addresses:
        - 10.202.20.10-10.202.20.20
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: default-l2
      namespace: metallb-system
    spec:
      ipAddressPools:
        - default-pool
    METALEOF
      then
        break
      fi
      idx=$((idx+1))
      sleep 20
    done
  # Helm
  - |
    idx=0
    while [ $idx -lt 5 ]; do
      if curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash; then break; fi
      idx=$((idx+1))
      sleep 20
    done
  # Traefik
  - |
    export KUBECONFIG=/root/.kube/config
    helm repo add traefik https://traefik.github.io/charts
    helm repo update
    kubectl create namespace traefik
    helm install traefik traefik/traefik --namespace traefik --values /root/traefik-values.yaml --wait --timeout 5m
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl apply -f /root/exemple-ingressroute.yaml
  - |
    export KUBECONFIG=/root/.kube/config
    idx=0
    while [ $idx -lt 30 ]; do
      TRAEFIK_IP=$(kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
      if [ -n "$TRAEFIK_IP" ]; then
        arping -c 2 -I ens3 $TRAEFIK_IP || true
        break
      fi
      idx=$((idx+1))
      sleep 5
    done
      # Attendre que tous les workers aient rejoint le cluster avant Rook
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Attente que les nodes soient Ready (minimum 4 = 1 CP + 3 workers)..."
    idx=0
    while [ $idx -lt 60 ]; do
      READY=$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready")
      echo "  Nodes Ready: $READY/4 (tentative $idx/60)"
      if [ "$READY" -ge 4 ]; then
        echo "Tous les nodes sont Ready!"
        break
      fi
      idx=$((idx+1))
      sleep 15
    done
  # ====================================================
  # ROOK-CEPH : Stockage distribué et Dashboard
  # (AVANT ArgoCD apps pour que la StorageClass soit prête)
  # ====================================================
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Installation de Rook-Ceph..."
    git clone --branch v1.15.2 https://github.com/rook/rook.git /root/rook
    cd /root/rook/deploy/examples
    kubectl create -f common.yaml -f crds.yaml -f operator.yaml
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Attente du démarrage de l'opérateur Rook..."
    kubectl -n rook-ceph wait --for=condition=available deployment/rook-ceph-operator --timeout=300s
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Création du CephCluster..."
    cat <<'CEPHEOF' | kubectl apply -f -
    apiVersion: ceph.rook.io/v1
    kind: CephCluster
    metadata:
      name: rook-ceph
      namespace: rook-ceph
    spec:
      cephVersion:
        image: quay.io/ceph/ceph:v18.2.4
      dataDirHostPath: /var/lib/rook
      mon:
        count: 3
      mgr:
        count: 1
      dashboard:
        enabled: true
        ssl: true
      storage:
        useAllNodes: true
        useAllDevices: false
        deviceFilter: "^vdb"
    CEPHEOF
  - |
    # Attente que le CephCluster soit READY avant de continuer
    export KUBECONFIG=/root/.kube/config
    echo "Attente que le CephCluster soit Ready (peut prendre 5-10 min)..."
    idx=0
    while [ $idx -lt 60 ]; do
      PHASE=$(kubectl get cephcluster rook-ceph -n rook-ceph -o jsonpath='{.status.phase}' 2>/dev/null)
      HEALTH=$(kubectl get cephcluster rook-ceph -n rook-ceph -o jsonpath='{.status.ceph.health}' 2>/dev/null)
      echo "  CephCluster phase=$PHASE health=$HEALTH (tentative $idx/60)"
      if [ "$PHASE" = "Ready" ]; then
        echo "CephCluster est Ready!"
        break
      fi
      idx=$((idx+1))
      sleep 15
    done
  - |
    # CONFIGURATION DU STOCKAGE (StorageClass + Pool)
    export KUBECONFIG=/root/.kube/config
    echo "Création du CephBlockPool et de la StorageClass..."
    cat <<'SCEOF' | kubectl apply -f -
    apiVersion: ceph.rook.io/v1
    kind: CephBlockPool
    metadata:
      name: replicapool
      namespace: rook-ceph
    spec:
      failureDomain: host
      replicated:
        size: 3
    ---
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: rook-ceph-block
    provisioner: rook-ceph.rbd.csi.ceph.com
    parameters:
      clusterID: rook-ceph
      pool: replicapool
      imageFormat: "2"
      imageFeatures: layering
      csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
      csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
      csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
      csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    SCEOF
  - |
    # Vérifier que les secrets CSI existent (nécessaires pour le provisioning PVC)
    export KUBECONFIG=/root/.kube/config
    echo "Attente des secrets CSI Rook..."
    idx=0
    while [ $idx -lt 30 ]; do
      if kubectl get secret rook-csi-rbd-provisioner -n rook-ceph > /dev/null 2>&1 && \
         kubectl get secret rook-csi-rbd-node -n rook-ceph > /dev/null 2>&1; then
        echo "Secrets CSI prêts!"
        break
      fi
      echo "  Attente des secrets CSI... (tentative $idx/30)"
      idx=$((idx+1))
      sleep 10
    done
  - |
    # Vérifier que le dashboard Ceph est accessible
    export KUBECONFIG=/root/.kube/config
    echo "Attente que le service dashboard Ceph soit prêt..."
    idx=0
    while [ $idx -lt 30 ]; do
      ENDPOINTS=$(kubectl get endpoints rook-ceph-mgr-dashboard -n rook-ceph -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null)
      if [ -n "$ENDPOINTS" ]; then
        echo "Dashboard Ceph a des endpoints actifs: $ENDPOINTS"
        break
      fi
      echo "  Attente des endpoints dashboard... (tentative $idx/30)"
      idx=$((idx+1))
      sleep 10
    done
  # Préparer le stockage local pour Grafana
  - mkdir -p /var/lib/grafana
  - chown 472:472 /var/lib/grafana
  - chmod 755 /var/lib/grafana
  # ====================================================
  # ARGOCD : Installation et Bootstrap GitOps
  # (APRÈS Rook-Ceph pour que les PVC fonctionnent)
  # ====================================================
  # ArgoCD install
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl create namespace argocd
    helm repo add argo https://argoproj.github.io/argo-helm
    helm repo update
    helm install argocd argo/argo-cd --namespace argocd --values /root/argocd-values.yaml --wait --timeout 10m
  # ArgoCD IngressRoutes - host-based
  - |
    export KUBECONFIG=/root/.kube/config
    cat <<'ARGOEOF' | kubectl apply -f -
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-server-http
      namespace: argocd
    spec:
      entryPoints:
        - web
      routes:
        - kind: Rule
          match: Host(`argocd.mpms.lab`)
          services:
            - name: argocd-server
              port: 80
    ---
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-server-https
      namespace: argocd
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`argocd.mpms.lab`)
          services:
            - name: argocd-server
              port: 80
      tls: {}
    ARGOEOF
  # Récupérer le mot de passe ArgoCD
  - |
    export KUBECONFIG=/root/.kube/config
    idx=0
    while [ $idx -lt 20 ]; do
      if kubectl get secret argocd-initial-admin-secret -n argocd > /dev/null 2>&1; then
        ARGOCD_PWD=$(kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath="{.data.password}" | base64 -d)
        echo "$ARGOCD_PWD" > /root/argocd-admin-password.txt
        chmod 600 /root/argocd-admin-password.txt
        break
      fi
      idx=$((idx+1))
      sleep 10
    done
  - curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
  - chmod +x /usr/local/bin/argocd
  # BOOTSTRAP ARGOCD GITOPS
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl apply -f /root/argocd-repo-creds.yaml
  - |
    export KUBECONFIG=/root/.kube/config
    idx=0
    while [ $idx -lt 10 ]; do
      if kubectl apply -f /root/argocd-apps.yaml; then
        echo "ArgoCD Applications créées avec succès!"
        break
      fi
      idx=$((idx+1))
      sleep 15
    done
  - rm -f /root/argocd-repo-creds.yaml
  # ====================================================
  # VELERO + MINIO : Backup du cluster
  # ====================================================
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Installation de Velero CLI..."
    wget -q https://github.com/vmware-tanzu/velero/releases/download/v1.15.0/velero-v1.15.0-linux-amd64.tar.gz
    tar -xzf velero-v1.15.0-linux-amd64.tar.gz
    mv velero-v1.15.0-linux-amd64/velero /usr/local/bin/
    rm -rf velero-v1.15.0-linux-amd64*
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Installation de Velero dans le cluster..."
    velero install \
      --provider aws \
      --plugins velero/velero-plugin-for-aws:v1.9.2 \
      --bucket velero \
      --secret-file /root/credentials-velero \
      --use-node-agent \
      --backup-location-config region=minio,s3ForcePathStyle="true",s3Url=http://minio.velero.svc:9000 \
      --use-volume-snapshots=false \
      --wait
  # Créer le Secret K8s pour MinIO (credentials depuis Terraform, pas en dur)
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl create secret generic minio-credentials -n velero \
      --from-literal=MINIO_ROOT_USER="${minio_access_key}" \
      --from-literal=MINIO_ROOT_PASSWORD="${minio_secret_key}" \
      --dry-run=client -o yaml | kubectl apply -f -
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Déploiement de MinIO..."
    kubectl apply -f /root/minio.yaml
    kubectl -n velero wait --for=condition=ready pod -l app=minio --timeout=120s || true
    kubectl -n velero exec deploy/minio -- mkdir -p /data/velero || true
  - rm -f /root/credentials-velero
  # ====================================================
  # VAULT : Auto-initialisation, Unseal et Population
  # ====================================================
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Attente du déploiement Vault par ArgoCD..."
    idx=0
    while [ $idx -lt 60 ]; do
      if kubectl get deployment vault -n vault > /dev/null 2>&1; then
        echo "Deployment Vault trouvé!"
        break
      fi
      echo "  Attente du deployment Vault... (tentative $idx/60)"
      idx=$((idx+1))
      sleep 15
    done
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Attente que le pod Vault soit Running..."
    kubectl -n vault wait --for=condition=ready pod -l app=vault --timeout=300s || true
    sleep 10
  - |
    export KUBECONFIG=/root/.kube/config
    VAULT_POD=$(kubectl get pods -n vault -l app=vault -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    if [ -z "$VAULT_POD" ]; then
      echo "ERREUR: Aucun pod Vault trouvé, abandon de l'auto-init."
      exit 0
    fi

    # Vérifier si Vault est déjà initialisé
    INIT_STATUS=$(kubectl exec -n vault "$VAULT_POD" -- vault status -format=json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('initialized', False))" 2>/dev/null || echo "false")

    if [ "$INIT_STATUS" = "True" ] || [ "$INIT_STATUS" = "true" ]; then
      echo "Vault est déjà initialisé, vérification du seal status..."
      SEALED=$(kubectl exec -n vault "$VAULT_POD" -- vault status -format=json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('sealed', True))" 2>/dev/null || echo "true")
      if [ "$SEALED" = "False" ] || [ "$SEALED" = "false" ]; then
        echo "Vault est déjà unseal, rien à faire."
        exit 0
      fi
    fi

    echo "Initialisation de Vault (3 key shares, threshold 2)..."
    INIT_OUTPUT=$(kubectl exec -n vault "$VAULT_POD" -- vault operator init \
      -key-shares=3 \
      -key-threshold=2 \
      -format=json 2>/dev/null)

    if [ -z "$INIT_OUTPUT" ]; then
      echo "ERREUR: Échec de l'initialisation Vault."
      exit 0
    fi

    # Extraire les unseal keys et le root token
    UNSEAL_KEY_1=$(echo "$INIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['unseal_keys_b64'][0])")
    UNSEAL_KEY_2=$(echo "$INIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['unseal_keys_b64'][1])")
    UNSEAL_KEY_3=$(echo "$INIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['unseal_keys_b64'][2])")
    ROOT_TOKEN=$(echo "$INIT_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['root_token'])")

    # Sauvegarder les credentials
    cat > /root/vault-credentials.txt <<VAULTCREDS
    ===================================
     VAULT CREDENTIALS - À SÉCURISER !
    ===================================
     Unseal Key 1: $UNSEAL_KEY_1
     Unseal Key 2: $UNSEAL_KEY_2
     Unseal Key 3: $UNSEAL_KEY_3
     Root Token:   $ROOT_TOKEN
     Threshold:    2/3
    ===================================
    VAULTCREDS
    chmod 600 /root/vault-credentials.txt
    echo "Credentials sauvegardés dans /root/vault-credentials.txt"

    # Unseal avec 2 des 3 keys (threshold = 2)
    echo "Unseal de Vault (key 1/2)..."
    kubectl exec -n vault "$VAULT_POD" -- vault operator unseal "$UNSEAL_KEY_1"
    sleep 2
    echo "Unseal de Vault (key 2/2)..."
    kubectl exec -n vault "$VAULT_POD" -- vault operator unseal "$UNSEAL_KEY_2"
    sleep 5

    echo "Statut final de Vault :"
    kubectl exec -n vault "$VAULT_POD" -- vault status
  # ====================================================
  # VAULT : Activer KV v2 et peupler les secrets
  # ====================================================
  - |
    export KUBECONFIG=/root/.kube/config
    VAULT_POD=$(kubectl get pods -n vault -l app=vault -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    ROOT_TOKEN=$(grep 'Root Token' /root/vault-credentials.txt | awk '{print $NF}')

    if [ -z "$ROOT_TOKEN" ] || [ -z "$VAULT_POD" ]; then
      echo "ERREUR: Vault non initialisé ou pod introuvable."
      exit 0
    fi

    echo "Activation du moteur de secrets KV v2..."
    kubectl exec -n vault "$VAULT_POD" -- env VAULT_TOKEN="$ROOT_TOKEN" \
      vault secrets enable -path=secret -version=2 kv 2>/dev/null || echo "KV déjà activé"

    echo "Population des secrets dans Vault..."

    # --- Pihole ---
    kubectl exec -n vault "$VAULT_POD" -- env VAULT_TOKEN="$ROOT_TOKEN" \
      vault kv put secret/pihole \
        webpassword="${pihole_password}" \
        api_password="${pihole_password}"
    echo "  ✓ secret/pihole"

    # --- Grafana ---
    kubectl exec -n vault "$VAULT_POD" -- env VAULT_TOKEN="$ROOT_TOKEN" \
      vault kv put secret/grafana \
        admin_password="${grafana_password}"
    echo "  ✓ secret/grafana"

    # --- MinIO / Velero ---
    kubectl exec -n vault "$VAULT_POD" -- env VAULT_TOKEN="$ROOT_TOKEN" \
      vault kv put secret/minio \
        access_key="${minio_access_key}" \
        secret_key="${minio_secret_key}"
    echo "  ✓ secret/minio"

    # --- GitHub PAT (pour référence/rotation future) ---
    kubectl exec -n vault "$VAULT_POD" -- env VAULT_TOKEN="$ROOT_TOKEN" \
      vault kv put secret/github \
        pat="${github_pat}"
    echo "  ✓ secret/github"

    # --- ArgoCD admin password ---
    ARGOCD_PWD=""
    if [ -f /root/argocd-admin-password.txt ]; then
      ARGOCD_PWD=$(cat /root/argocd-admin-password.txt)
    fi
    if [ -n "$ARGOCD_PWD" ]; then
      kubectl exec -n vault "$VAULT_POD" -- env VAULT_TOKEN="$ROOT_TOKEN" \
        vault kv put secret/argocd \
          admin_password="$ARGOCD_PWD"
      echo "  ✓ secret/argocd"
    fi

    echo "Tous les secrets sont dans Vault!"
  # ====================================================
  # ESO : Créer le token K8s Secret pour ClusterSecretStore
  # (ce secret est créé par cloud-init, pas dans Git)
  # ====================================================
  - |
    export KUBECONFIG=/root/.kube/config
    ROOT_TOKEN=$(grep 'Root Token' /root/vault-credentials.txt | awk '{print $NF}')

    if [ -z "$ROOT_TOKEN" ]; then
      echo "ERREUR: Root token introuvable."
      exit 0
    fi

    echo "Création du Secret vault-token pour ESO..."
    kubectl create secret generic vault-token -n vault \
      --from-literal=token="$ROOT_TOKEN" \
      --dry-run=client -o yaml | kubectl apply -f -
    echo "  ✓ Secret vault-token créé dans le namespace vault"
  # ====================================================
  # ESO : Attendre que ESO soit prêt et forcer le sync
  # ====================================================
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Attente du déploiement ESO par ArgoCD..."
    idx=0
    while [ $idx -lt 60 ]; do
      if kubectl get deployment external-secrets -n external-secrets > /dev/null 2>&1; then
        echo "ESO trouvé!"
        kubectl -n external-secrets wait --for=condition=available deployment/external-secrets --timeout=300s || true
        break
      fi
      echo "  Attente d'ESO... (tentative $idx/60)"
      idx=$((idx+1))
      sleep 15
    done
    # Laisser le temps à ESO d'enregistrer les CRDs
    sleep 30
  # Forcer ArgoCD à re-sync les apps pour que les ExternalSecrets soient traités
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Re-sync des applications ArgoCD pour activer les ExternalSecrets..."
    ARGOCD_PWD=""
    if [ -f /root/argocd-admin-password.txt ]; then
      ARGOCD_PWD=$(cat /root/argocd-admin-password.txt)
    fi
    if [ -n "$ARGOCD_PWD" ]; then
      argocd login argocd-server.argocd.svc:443 --grpc-web --insecure \
        --username admin --password "$ARGOCD_PWD" 2>/dev/null || true
      for app in vault-config pihole grafana; do
        argocd app sync "$app" --force 2>/dev/null || true
      done
    fi
    # Attendre que les ExternalSecrets soient synced
    idx=0
    while [ $idx -lt 20 ]; do
      READY=$(kubectl get externalsecrets -A --no-headers 2>/dev/null | grep -c "SecretSynced" || echo "0")
      TOTAL=$(kubectl get externalsecrets -A --no-headers 2>/dev/null | wc -l)
      echo "  ExternalSecrets synced: $READY/$TOTAL (tentative $idx/20)"
      if [ "$TOTAL" -gt 0 ] && [ "$READY" -eq "$TOTAL" ]; then
        echo "Tous les ExternalSecrets sont synced!"
        break
      fi
      idx=$((idx+1))
      sleep 15
    done
    echo ""
    echo "=========================================="
    echo " INFRASTRUCTURE PRÊTE"
    echo " Tous les secrets sont gérés par Vault"
    echo " Exécuter: /root/check-cluster.sh"
    echo "=========================================="