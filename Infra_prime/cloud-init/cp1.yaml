#cloud-config
package_update: true
package_upgrade: false

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - arping

write_files:
  - content: |
      127.0.0.1 localhost
      ${control_plane_ip} k8s-api.local
    path: /etc/hosts

  - content: |
      ingressRoute:
        dashboard:
          enabled: false
      service:
        enabled: true
        type: LoadBalancer
      ports:
        web:
          port: 8000
          expose:
            default: true
          exposedPort: 80
          protocol: TCP
        websecure:
          port: 8443
          expose:
            default: true
          exposedPort: 443
          protocol: TCP
      providers:
        kubernetesCRD:
          enabled: true
          allowCrossNamespace: true
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: true
    path: /root/traefik-values.yaml

  - content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: whoami
        namespace: default
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: whoami
        template:
          metadata:
            labels:
              app: whoami
          spec:
            containers:
              - name: whoami
                image: traefik/whoami
                ports:
                  - containerPort: 80
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: whoami
        namespace: default
      spec:
        selector:
          app: whoami
        ports:
          - port: 80
            targetPort: 80
      ---
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: strip-whoami
        namespace: default
      spec:
        stripPrefix:
          prefixes:
            - /whoami
      ---
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: whoami-route
        namespace: default
      spec:
        entryPoints:
          - web
        routes:
          - kind: Rule
            match: "PathPrefix(`/whoami`)"
            middlewares:
              - name: strip-whoami
            services:
              - name: whoami
                port: 80
    path: /root/exemple-ingressroute.yaml

  - content: |
      controller:
        replicas: 1
      redis-ha:
        enabled: true
      server:
        replicas: 1
        service:
          type: ClusterIP
        ingress:
          enabled: false
      repoServer:
        replicas: 1
      applicationSet:
        replicas: 1
      configs:
        params:
          server.insecure: true
          server.basehref: /argocd
          server.rootpath: /argocd
    path: /root/argocd-values.yaml

  # ==============================================
  # ArgoCD repo credentials (Secret avec PAT GitHub)
  # Le label repo-creds fait qu'ArgoCD l'utilise
  # automatiquement pour tout repo sous cette URL
  # ==============================================
  - content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: github-repo-creds
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      stringData:
        type: git
        url: https://github.com/PierreJaloghlian
        username: PierreJaloghlian
        password: ${github_pat}
    path: /root/argocd-repo-creds.yaml
    permissions: '0600'

  # ==============================================
  # ArgoCD Applications - GitOps monitoring stack
  # ==============================================
  - content: |
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: monitoring
        namespace: argocd
      spec:
        description: Monitoring stack (Grafana, Prometheus, kube-state-metrics)
        sourceRepos:
          - "https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git"
        destinations:
          - namespace: "*"
            server: https://kubernetes.default.svc
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: grafana
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: grafana
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: prometheus
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: prometheus
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
      ---
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: kube-state-metrics
        namespace: argocd
      spec:
        project: monitoring
        source:
          repoURL: https://github.com/PierreJaloghlian/SAE_Cloud_Openstack.git
          targetRevision: main
          path: kube-state-metrics
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
    path: /root/argocd-apps.yaml

  - content: |
      #!/bin/bash
      export KUBECONFIG=/root/.kube/config

      echo "=========================================="
      echo "        ÉTAT DU CLUSTER KUBERNETES       "
      echo "=========================================="
      echo ""
      
      echo "=== Nodes ==="
      kubectl get nodes -o wide
      echo ""
      
      echo "=== Cilium ==="
      kubectl get pods -n kube-system -l app.kubernetes.io/part-of=cilium --no-headers | head -5
      echo "... ($(kubectl get pods -n kube-system -l app.kubernetes.io/part-of=cilium --no-headers | wc -l) pods total)"
      echo ""
      
      echo "=== MetalLB ==="
      kubectl get pods -n metallb-system --no-headers
      kubectl get ipaddresspool -n metallb-system
      echo ""
      
      echo "=== Traefik ==="
      kubectl get pods -n traefik
      kubectl get svc -n traefik
      echo ""
      
      echo "=== ArgoCD ==="
      kubectl get pods -n argocd --no-headers | head -10
      echo "... ($(kubectl get pods -n argocd --no-headers | wc -l) pods total)"
      echo ""

      echo "=== ArgoCD Applications ==="
      kubectl get applications -n argocd
      echo ""

      echo "=== Grafana ==="
      kubectl get pods -n grafana 2>/dev/null || echo "  (pas encore déployé)"
      echo ""

      echo "=== Prometheus ==="
      kubectl get pods -n monitoring 2>/dev/null || echo "  (pas encore déployé)"
      echo ""
      
      TRAEFIK_IP=$(kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
      if [ -n "$TRAEFIK_IP" ]; then
        echo "=========================================="
        echo "  ACCÈS AUX SERVICES"
        echo "=========================================="
        echo "  Traefik:     http://$TRAEFIK_IP"
        echo "  Whoami:      http://$TRAEFIK_IP/whoami"
        echo "  ArgoCD:      http://$TRAEFIK_IP/argocd/"
        echo "  ArgoCD:      https://$TRAEFIK_IP/argocd/ (certificat auto-signé)"
        echo "  Grafana:     http://$TRAEFIK_IP/grafana"
        echo "  Prometheus:  http://$TRAEFIK_IP/prometheus"
        echo ""
        echo "  ArgoCD Login:"
        echo "    Username: admin"
        if [ -f /root/argocd-admin-password.txt ]; then
          echo "    Password: $(cat /root/argocd-admin-password.txt)"
        else
          echo "    Password: kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath='{.data.password}' | base64 -d"
        fi
        echo ""
        echo "  Grafana Login:"
        echo "    Username: admin"
        echo "    Password: admin (change au premier login)"
        echo "=========================================="
      fi
    path: /root/check-cluster.sh
    permissions: '0755'

runcmd:
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab
  - echo -e "overlay\nbr_netfilter" > /etc/modules-load.d/k8s.conf
  - modprobe overlay && modprobe br_netfilter
  - echo -e "net.bridge.bridge-nf-call-ip6tables = 1\nnet.bridge.bridge-nf-call-iptables = 1\nnet.ipv4.ip_forward = 1" > /etc/sysctl.d/k8s.conf
  - sysctl --system
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - |
    ARCH=$(dpkg --print-architecture)
    CODENAME=$(lsb_release -cs)
    echo "deb [arch=$ARCH signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $CODENAME stable" > /etc/apt/sources.list.d/docker.list
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y containerd.io kubelet=1.30.14-* kubeadm=1.30.14-* kubectl=1.30.14-*
  - apt-mark hold kubelet kubeadm kubectl
  - containerd config default | tee /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable --now kubelet
  - kubeadm init --kubernetes-version=v1.30.14 --control-plane-endpoint "k8s-api.local:6443" --pod-network-cidr=10.244.0.0/16 --upload-certs --ignore-preflight-errors=NumCPU,Mem
  - mkdir -p /root/.kube && cp /etc/kubernetes/admin.conf /root/.kube/config
  - mkdir -p /home/ubuntu/.kube && cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
  - chown ubuntu:ubuntu /home/ubuntu/.kube/config
  - |
    CERT_KEY=$(kubeadm init phase upload-certs --upload-certs | tail -1)
    JOIN_CMD=$(kubeadm token create --print-join-command)
    echo "$JOIN_CMD" > /root/join-worker.sh
    echo "$JOIN_CMD --control-plane --certificate-key $CERT_KEY" > /root/join-cp.sh
    chmod +x /root/join-worker.sh /root/join-cp.sh
  # Cilium CNI
  - |
    export KUBECONFIG=/root/.kube/config
    curl -L --remote-name-all https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-amd64.tar.gz
    tar -xzf cilium-linux-amd64.tar.gz -C /usr/local/bin
    /usr/local/bin/cilium install --version 1.16.5
  - |
    export KUBECONFIG=/root/.kube/config
    sleep 30
    kubectl wait --for=condition=Ready pods -l app.kubernetes.io/part-of=cilium -n kube-system --timeout=300s || true
  # MetalLB
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl wait --namespace metallb-system --for=condition=available deployment/controller --timeout=300s || sleep 60
  - |
    export KUBECONFIG=/root/.kube/config
    idx=0
    while [ $idx -lt 10 ]; do
      if cat <<'METALEOF' | kubectl apply -f -
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: default-pool
      namespace: metallb-system
    spec:
      addresses:
        - 10.202.20.10-10.202.20.20
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: default-l2
      namespace: metallb-system
    spec:
      ipAddressPools:
        - default-pool
    METALEOF
      then
        break
      fi
      idx=$((idx+1))
      sleep 20
    done
  # Helm
  - |
    idx=0
    while [ $idx -lt 5 ]; do
      if curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash; then break; fi
      idx=$((idx+1))
      sleep 20
    done
  # Traefik
  - |
    export KUBECONFIG=/root/.kube/config
    helm repo add traefik https://traefik.github.io/charts
    helm repo update
    kubectl create namespace traefik
    helm install traefik traefik/traefik --namespace traefik --values /root/traefik-values.yaml --wait --timeout 5m
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl apply -f /root/exemple-ingressroute.yaml
  - |
    export KUBECONFIG=/root/.kube/config
    idx=0
    while [ $idx -lt 30 ]; do
      TRAEFIK_IP=$(kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
      if [ -n "$TRAEFIK_IP" ]; then
        arping -c 2 -I ens3 $TRAEFIK_IP || true
        break
      fi
      idx=$((idx+1))
      sleep 5
    done
  # ArgoCD install
  - |
    export KUBECONFIG=/root/.kube/config
    kubectl create namespace argocd
    helm repo add argo https://argoproj.github.io/argo-helm
    helm repo update
    helm install argocd argo/argo-cd --namespace argocd --values /root/argocd-values.yaml --wait --timeout 10m
  # ArgoCD IngressRoutes
  - |
    export KUBECONFIG=/root/.kube/config
    cat <<'ARGOEOF' | kubectl apply -f -
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-server-http
      namespace: argocd
    spec:
      entryPoints:
        - web
      routes:
        - kind: Rule
          match: PathPrefix(`/argocd`)
          services:
            - name: argocd-server
              port: 80
    ---
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-server-https
      namespace: argocd
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: PathPrefix(`/argocd`)
          services:
            - name: argocd-server
              port: 80
      tls: {}
    ARGOEOF
  # Récupérer le mot de passe ArgoCD
  - |
    export KUBECONFIG=/root/.kube/config
    idx=0
    while [ $idx -lt 20 ]; do
      if kubectl get secret argocd-initial-admin-secret -n argocd > /dev/null 2>&1; then
        ARGOCD_PWD=$(kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath="{.data.password}" | base64 -d)
        echo "$ARGOCD_PWD" > /root/argocd-admin-password.txt
        chmod 600 /root/argocd-admin-password.txt
        break
      fi
      idx=$((idx+1))
      sleep 10
    done
  - curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
  - chmod +x /usr/local/bin/argocd
  # ====================================================
  # BOOTSTRAP ARGOCD GITOPS
  # 1. Secret avec PAT GitHub pour repo privé
  # 2. Applications ArgoCD (Grafana, Prometheus, KSM)
  # 3. Nettoyage du fichier contenant le PAT
  # ====================================================
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Configuration des credentials du repo privé GitHub..."
    kubectl apply -f /root/argocd-repo-creds.yaml
  - |
    export KUBECONFIG=/root/.kube/config
    echo "Déploiement des ArgoCD Applications..."
    idx=0
    while [ $idx -lt 10 ]; do
      if kubectl apply -f /root/argocd-apps.yaml; then
        echo "ArgoCD Applications créées avec succès!"
        break
      fi
      idx=$((idx+1))
      sleep 15
    done
  # Nettoyage du PAT du disque (sécurité)
  - rm -f /root/argocd-repo-creds.yaml
  # Préparer le stockage local pour Grafana
  - mkdir -p /var/lib/grafana
  - chown 472:472 /var/lib/grafana
  - chmod 755 /var/lib/grafana
  # Rafraîchir les routes Traefik
  - |
    export KUBECONFIG=/root/.kube/config
    TRAEFIK_IP=$(kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
    if [ -n "$TRAEFIK_IP" ]; then
      sleep 10
      curl -s -o /dev/null http://$TRAEFIK_IP/whoami || true
      curl -s -o /dev/null http://$TRAEFIK_IP/argocd/ || true
      curl -sk -o /dev/null https://$TRAEFIK_IP/argocd/ || true
    fi
  - touch /root/cloud-init-complete